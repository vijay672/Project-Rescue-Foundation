version: '3.8'

# ==============================================================================
# Production Docker Compose for Project Rescue Foundation
# Optimized for hardened Linux hosts, cloud VMs, and dedicated instances
# ==============================================================================

services:
  # 1. Reverse Proxy & Frontend Web Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-80}:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_SUPABASE_STORAGE_BUCKET=${VITE_SUPABASE_STORAGE_BUCKET:-foundation-media}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rescue_production_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: always

  # 2. FastAPI REST & PostGIS Geospatial Backend (Gunicorn/Uvicorn multi-worker)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://:rescue_secure_redis_pwd@redis:6379/0}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      ENVIRONMENT: production_compose
      SUPABASE_URL: ${VITE_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${VITE_SUPABASE_STORAGE_BUCKET:-foundation-media}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-30}
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rescue_production_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  # 3. Celery Worker (Security Quarantine & Media Derivatives)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_worker.app worker --loglevel=info -Q security_quarantine,media_processing,analytics --concurrency=4
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://:rescue_secure_redis_pwd@redis:6379/0}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      ENVIRONMENT: production_compose
      SUPABASE_URL: ${VITE_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${VITE_SUPABASE_STORAGE_BUCKET:-foundation-media}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - rescue_production_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  # 4. Celery Beat (Periodic Regional Compliance & Quota Rollups)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_worker.app beat --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://:rescue_secure_redis_pwd@redis:6379/0}
      ENVIRONMENT: production_compose
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rescue_production_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: always

  # 5. ClamAV Antivirus Daemon (TCP 3310)
  clamav:
    image: clamav/clamav:latest
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - rescue_production_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    restart: always

  # 6. Redis Broker with Password Authentication & AOF Persistence
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:-rescue_secure_redis_pwd}" --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rescue_secure_redis_pwd}", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - rescue_production_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: always

volumes:
  redis_production_data:
  clamav_db:

networks:
  rescue_production_net:
    driver: bridge
